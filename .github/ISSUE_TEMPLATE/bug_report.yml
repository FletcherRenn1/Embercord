name: Bug report
description: Report a reproducible problem with Embercord.
title: "[Bug] "
body:
  - type: input
    id: embercord
    attributes:
      label: Embercord version or commit
    validations:
      required: true
  - type: input
    id: phoenix
    attributes:
      label: Discord Phoenix build
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, identifiers, and private information before posting.
