name: Feature request
description: Suggest a feature or improvement for Embercord.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case or problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
